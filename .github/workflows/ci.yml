name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - name: Check AWS creds
        id: check_creds
        run: |
          if [ -z "${{ secrets.AWS_ACCESS_KEY_ID }}" ] || [ -z "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ]; then
            echo "missing=true" >> $GITHUB_OUTPUT
          else
            echo "missing=false" >> $GITHUB_OUTPUT
          fi
      - uses: actions/setup-node@v4
        if: steps.check_creds.outputs.missing == 'false'
        with:
          node-version: 18
      - name: Build Lambda (backend)
        if: steps.check_creds.outputs.missing == 'false'
        run: |
          cd backend
          npm ci
          npm run build
      - uses: hashicorp/setup-terraform@v3
        if: steps.check_creds.outputs.missing == 'false'
        with:
          terraform_version: 1.8.5
      - uses: aws-actions/configure-aws-credentials@v4
        if: steps.check_creds.outputs.missing == 'false'
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-1
      - name: Terraform Init (dev)
        if: steps.check_creds.outputs.missing == 'false'
        run: terraform init -reconfigure -backend-config=backend-dev.hcl
      - name: Terraform Plan (dev)
        if: steps.check_creds.outputs.missing == 'false'
        run: terraform plan -var-file=dev.tfvars
      - name: Terraform Apply (main only)
        if: steps.check_creds.outputs.missing == 'false' && github.ref == 'refs/heads/main'
        run: terraform apply -auto-approve -var-file=dev.tfvars

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install deps
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
