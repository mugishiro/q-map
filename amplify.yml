version: 1
applications:
  - appRoot: .
    frontend:
      phases:
        preBuild:
          commands:
            - if [ -f package.json ]; then npm ci; else echo "skip npm ci (no frontend)"; fi
        build:
          commands:
            - if [ -f package.json ]; then npm run build; else mkdir -p dist && echo "<!doctype html><title>QMap</title><body>Placeholder build</body>" > dist/index.html; fi
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
    env:
      variables:
        VITE_API_BASE_URL: "/api"
        VITE_APP_STAGE: "dev"
        VITE_COGNITO_USER_POOL_ID: "ap-northeast-1_jzrsFPU1b"
        VITE_COGNITO_CLIENT_ID: "q7133rf9epm3dmfgtghcifoan"
        VITE_COGNITO_DOMAIN: "qmap-qmap-dev"
