version: 1
applications:
  - appRoot: frontend
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
    env:
      variables:
        VITE_API_BASE_URL: "/api"
        VITE_APP_STAGE: "dev"
        VITE_COGNITO_USER_POOL_ID: "ap-northeast-1_jzrsFPU1b"
        VITE_COGNITO_CLIENT_ID: "q7133rf9epm3dmfgtghcifoan"
        VITE_COGNITO_DOMAIN: "qmap-qmap-dev"
